<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Summarizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📹 YouTube Video Summarizer</h1>
            <p class="subtitle">Get the main talking points from any YouTube video instantly</p>
        </header>

        <main>
            <div class="input-section">
                <input
                    type="text"
                    id="youtubeUrl"
                    placeholder="Paste YouTube URL here (e.g., https://youtube.com/watch?v=...)"
                    aria-label="YouTube URL input"
                >
                <button id="summarizeBtn">
                    Summarize Video
                </button>
            </div>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Fetching transcript and generating summary...</p>
            </div>

            <div id="error" class="error hidden">
                <p id="errorMessage"></p>
            </div>

            <div id="result" class="result hidden">
                <h2>Summary</h2>
                <div id="summaryContent" class="summary-content"></div>
                <div class="video-info">
                    <small id="videoInfo"></small>
                </div>
            </div>
        </main>

        <footer>
            <p>Built with Python, Flask, and Groq AI</p>
            <p class="tip">💡 Tip: This works best with videos that have captions/transcripts enabled</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
